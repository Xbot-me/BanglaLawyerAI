services:
  # 1. PostgreSQL 16 Database with pgvector Extension
  db:
    image: pgvector/pgvector:pg16
    container_name: lawyer_postgres_db
    restart: always
    environment:
      POSTGRES_DB: lawyer_db
      POSTGRES_USER: lawyer_user
      POSTGRES_PASSWORD: lawyer_pass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawyer_user -d lawyer_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  # 2. FastAPI Web Application Service (Connected to Central Caddy Proxy Network)
  web:
    build: .
    container_name: lawyer_web_app
    restart: always
    env_file:
      - .env.example
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=lawyer_db
      - POSTGRES_USER=lawyer_user
      - POSTGRES_PASSWORD=lawyer_pass
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-llama_groq}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy

volumes:
  pgdata:

networks:
  default:
  proxy:
    external: true
